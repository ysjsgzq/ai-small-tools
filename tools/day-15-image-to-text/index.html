<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片转文字 · 免费在线提取 · AI帮我做 Day 15</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f6; color: #222; padding: 28px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #667; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { background: #3aa56d; color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #a9c9b6; cursor: wait; }
  input[type=file] { font-size: 14px; }
  #status { font-size: 14px; color: #556; margin-top: 10px; }
  textarea { width: 100%; height: 180px; border: 1px solid #d8dcd8; border-radius: 8px; padding: 10px; font-size: 15px; line-height: 1.8; resize: vertical; }
  .hint { color: #889; font-size: 12px; margin-top: 8px; line-height: 1.7; }
  #imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  #imgs img { height: 80px; border: 1px solid #e4e8e4; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>图片转文字（免费在线提取）</h1>
  <div class="sub">截图、照片、书页里的文字，选图识别、直接复制。AI帮我做 · Day 15</div>

  <div class="card">
    <h2>选择图片（可多选：png / jpg）</h2>
    <div class="row">
      <input type="file" id="files" accept="image/png,image/jpeg" multiple>
      <button id="go" disabled>开始识别</button>
      <button class="ghost" id="copy" disabled style="background:#eef4ef;color:#3aa56d">复制全部文字</button>
    </div>
    <div id="imgs"></div>
    <div id="status"></div>
    <div class="hint">识别在浏览器本地完成（首次联网加载引擎，之后走缓存），图片不上传。清晰截图效果最好；手写和艺术字不适合。</div>
  </div>

  <div class="card">
    <h2>识别结果</h2>
    <textarea id="out" placeholder="识别完成后，文字出现在这里，可编辑，可复制。"></textarea>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let files = [];

document.getElementById('files').addEventListener('change', e => {
  files = [...e.target.files];
  const box = document.getElementById('imgs');
  box.innerHTML = '';
  files.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    box.appendChild(img);
  });
  document.getElementById('go').disabled = files.length === 0;
  document.getElementById('status').textContent = files.length + ' 张待识别。';
});

// 识别前预处理：放大 2 倍 + 灰度化——小字号识别率的关键
function preprocess(file) {
  return new Promise(async resolve => {
    const bmp = await createImageBitmap(file);
    const scale = 2;
    const c = document.createElement('canvas');
    c.width = bmp.width * scale; c.height = bmp.height * scale;
    const ctx = c.getContext('2d');
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const data = ctx.getImageData(0, 0, c.width, c.height);
    const d = data.data;
    for (let i = 0; i < d.length; i += 4) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    ctx.putImageData(data, 0, 0);
    resolve(c);
  });
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  const out = [];
  for (let i = 0; i < files.length; i++) {
    document.getElementById('status').textContent = '正在识别第 ' + (i + 1) + ' / ' + files.length + ' 张…';
    const canvas = await preprocess(files[i]);
    const res = await Tesseract.recognize(canvas, 'chi_sim+eng');
    let text = res.data.text;
    // 中文结果常带字间空格（识 别），压缩掉
    text = text.replace(/ ?([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]) ?/g, '$1');
    out.push(text.trim());
    window.__lastOcr = window.__lastOcr || [];
    window.__lastOcr.push({ name: files[i].name, text: text.trim() });
  }
  document.getElementById('out').value = out.join('\n————\n');
  document.getElementById('status').textContent = files.length + ' 张识别完成，结果可编辑。';
  document.getElementById('copy').disabled = false;
  btn.disabled = false;
});

document.getElementById('copy').addEventListener('click', () => {
  const ta = document.getElementById('out');
  ta.select();
  document.execCommand('copy');
  document.getElementById('status').textContent = '已复制到剪贴板。';
});
</script>
</body>
</html>
